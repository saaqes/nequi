# Blueprint de Render: un web service (Node) + una base de datos Postgres
services:
  - type: web
    name: nequi
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: nequi-db
          property: connectionString
      - key: ADMIN_KEY
        sync: false

databases:
  - name: nequi-db
    plan: free
    databaseName: nequi
    user: nequi
